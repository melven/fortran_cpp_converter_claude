name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check f2cpp tests tools

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      F2CPP_REQUIRE_TOOLCHAIN: "1"     # compile / run tests must not be skipped here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tool chain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran g++ libeigen3-dev libgtest-dev liblapack-dev valgrind
      - name: Python packages
        run: pip install -e .[test] pytest-cov
      - name: Tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage
          path: coverage.xml
