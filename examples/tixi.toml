# f2cpp function map ([map.functions]) for the TIXI XML library, generated by tools/make_tixi_config.py
# from tixi.h: the Fortran 2003 binding and the C API share names and argument order.
# {i:cstr}: std::string -> const char*, {i:ptr}: address of an output argument,
# {i:data}: data pointer of an Eigen array.
#
# Check by hand (output strings / arrays, Fortran used character or array pointers):
#   tixiAddDoubleListWithAttributes
#   tixiExportDocumentAsString
#   tixiExportElementAsString
#   tixiGetArray
#   tixiGetArrayDimensionNames
#   tixiGetArrayElementNames
#   tixiGetArrayParameterNames
#   tixiGetAttributeName
#   tixiGetChildNodeName
#   tixiGetDocumentPath
#   tixiGetFloatVector
#   tixiGetNodeType
#   tixiGetTextAttribute
#   tixiGetTextElement
#   tixiUIDGetXPath
#   tixiXPathExpressionGetTextByIndex
#   tixiXPathExpressionGetXPath
#   tixiXSLTransformationToString

[project]
includes = ['<tixi.h>']

[modules]
tixi = {header = ""}              # the C header replaces the module

[map.functions]
tixiGetVersion = "tixiGetVersion()"
