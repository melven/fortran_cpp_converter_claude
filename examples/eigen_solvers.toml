# Example: Fortran solver classes replaced by Eigen decompositions.
# Adapt the type names, binding names and argument positions to the Fortran classes.
# {self}: the object the method is called on; {0}, {1}, ...: the arguments (without ierr).

[modules]                   # no header of the replaced Fortran modules
eigensolver_mod = {header = ""}
linearsolver_mod = {header = ""}
leastsquares_mod = {header = ""}

[types.eigensolver_type]
cpp = "Eigen::EigenSolver<mat>"

[types.eigensolver_type.bindings]
# call es%solveSymmetric(A, lambda, V, ierr): the symmetric case uses another Eigen class than the object
solvesymmetric.template = "{ Eigen::SelfAdjointEigenSolver<mat> es_({0}); {1} = es_.eigenvalues(); {2} = es_.eigenvectors(); }"
# call es%solveNonsymmetric(A, lambda, V, ierr): eigenvalues / eigenvectors are complex in general
solvenonsymmetric.template = "{self}.compute({0}); {1} = {self}.eigenvalues().real(); {2} = {self}.eigenvectors().real();  // TODO: complex eigenvalues"

[types.linearsolver_type]
cpp = "Eigen::PartialPivLU<mat>"

[types.linearsolver_type.bindings]
# call lu%setup(n, ierr): not needed (the decomposition is sized by compute) -> empty template drops the call
setup.template = ""
# call lu%factorize(A, ierr); call lu%solve(b, x, ierr)
factorize.template = "{self}.compute({0});"
solve.template = "{1} = {self}.solve({0});"

[types.leastsquares_type]
cpp = "Eigen::ColPivHouseholderQR<mat>"

[types.leastsquares_type.bindings]
# call ls%solve(A, b, x, ierr)
solve.template = "{2} = {self}.compute({0}).solve({1});"
