# f2cpp config of the tests
style = "f2cpp_style.toml"

[project]
namespace = "project"
includes = ['"project_math.hpp"', '"lapack_compat.hpp"']
constructor_bindings = ["configure", "init"]
drop_args = ["userData"]              # class(*) user data of callbacks
strict = true                         # internal errors (f2cpp bugs) fail the test instead of becoming TODO comments

[map.includes]
"project_macros.h" = ""

# project helper functions / subroutines with a direct C++ counterpart (same arguments)
[map.functions]
str = "std::to_string"

[map.calls]
# sort_rank(x, iperm): iperm = (1-based) permutation that sorts x in ascending order
sort_rank = "{1}.resize({0}.size()); std::iota({1}.begin(), {1}.end(), 1); std::stable_sort({1}.begin(), {1}.end(), [&](int i_, int j_) { return {0}(i_ - 1) < {0}(j_ - 1); });"

[tests]
includes = ['"gtest_eigen.hpp"']

[modules]
legacy_mod = {header = "legacy.hpp"}

[types]
legacy_type = {cpp = "wrappers::Legacy"}
